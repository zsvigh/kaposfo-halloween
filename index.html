<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Búú! – Kaposfő Halloween térkép</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@400;600&display=swap">
<style>
:root{--or:#ff8a00;--ink:#2b1b3d;--pu:#6b2fb3;--cream:#fff4dc}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--pu);color:var(--ink);font-family:Fredoka,system-ui,sans-serif}
.screen{display:none;min-height:100%;padding:24px 16px;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.screen.on{display:flex}
#app.on{display:flex;flex-direction:column;height:100%;padding:0;justify-content:flex-start;align-items:stretch;gap:0}
h1,h2{font-family:Bangers,Fredoka,sans-serif;letter-spacing:2px;margin:0;font-weight:400}
h1{font-size:3.2rem;color:var(--or);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink)}
h2{font-size:1.9rem;color:var(--cream);text-shadow:3px 3px 0 var(--ink)}
.card{background:var(--cream);border:3px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:18px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
input,select,button{font:inherit;font-size:1.05rem;border:3px solid var(--ink);border-radius:12px;padding:12px;min-height:48px}
button{background:var(--or);color:var(--ink);font-weight:600;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:disabled{background:#ccc;color:#777;cursor:not-allowed;box-shadow:none}
#err{color:#ffd0d0;font-weight:600;min-height:1.2em}
header{padding:8px 12px;background:var(--pu);border-bottom:3px solid var(--ink);display:flex;align-items:center;gap:8px}
header h2{flex:1;font-size:1.5rem;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{min-height:40px;padding:6px 10px;font-size:.9rem}
#map{flex:1 1 55%;min-height:260px;border-bottom:3px solid var(--ink)}
/* rajzfilmes térkép: telített színek, erős kontraszt */
.leaflet-tile-pane{filter:saturate(2.6) contrast(1.25) brightness(1.05) hue-rotate(-6deg)}
#list{flex:1 1 45%;overflow:auto;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom));list-style:none;background:var(--pu)}
#list li{display:flex;gap:12px;align-items:center;padding:10px 12px;margin-bottom:10px;background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;min-height:56px}
#list li.on{background:#ffe3a8}
.n{flex:none;width:36px;height:36px;border-radius:50% 50% 45% 45%;background:var(--or);border:3px solid var(--ink);font-weight:700;display:grid;place-items:center}
.t{flex:1;text-align:left}.t b{display:block}.t span{font-size:.8rem;color:#6a5a7a}
.warn .t span{color:#b85c00}
#list li.done{opacity:.55}#list li.done .t b{text-decoration:line-through}
.ck{flex:none;width:30px;height:30px;min-height:0;padding:0;accent-color:var(--or);cursor:pointer;box-shadow:none}
.pk{background:none;border:0}
.me{width:18px;height:18px;border-radius:50%;background:#1e88ff;border:3px solid #fff;box-shadow:0 0 0 3px var(--ink),0 0 0 8px #1e88ff55}
#gps{position:absolute;z-index:1000;right:10px;top:10px;width:46px;padding:0;font-size:1.4rem}
#gps.on{background:#7be37b}
@media(min-width:800px){#app.on{flex-direction:row;flex-wrap:wrap}header{width:100%}#map{flex:1 1 65%;border-bottom:0}#list{flex:0 0 35%}}
</style>
</head>
<body>

<section id="s-login" class="screen on">
  <h1>🎃 Búú!</h1>
  <h2>Kaposfő Halloween</h2>
  <div class="card"><button id="b-login">Belépés Google-fiókkal</button></div>
  <div id="err"></div>
</section>

<section id="s-count" class="screen">
  <h2>Hány gyerekkel mész?</h2>
  <div class="card">
    <select id="sel-count"><option value="">Válassz…</option></select>
    <button id="b-count" disabled>Mentés</button>
  </div>
</section>

<section id="s-names" class="screen">
  <h2 id="names-title"></h2>
  <div class="card">
    <div id="names-fields" style="display:flex;flex-direction:column;gap:10px"></div>
    <button id="b-names" disabled>Mentés</button>
  </div>
</section>

<section id="app" class="screen">
  <header><h2 id="hdr"></h2><button id="b-out">Kilépés</button></header>
  <div id="map" style="position:relative"><button id="gps" title="Hol vagyok?">📍</button></div>
  <ul id="list"></ul>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var SB_URL='https://enshgjdrdynctarggsep.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVuc2hnamRyZHluY3Rhcmdnc2VwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0NTMxMTYsImV4cCI6MjEwOTAyOTExNn0.xrxLT4V3qqItU3_cNdLs1CBFnBIWf7hnAmlJ068G5EI';
var sb=supabase.createClient(SB_URL,SB_KEY);
var $=function(id){return document.getElementById(id)};
function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.toggle('on',s.id===id)});}

// ---- Nominatim-ból előre lekérve. ok = házszám-pontos / street = csak utca-szintű / none = nincs találat
var CENTER=[46.3610,17.6620];
var P=[
["Kossuth Lajos utca 133.",46.361867,17.666548,"ok"],
["Kossuth Lajos utca 155.",46.361210,17.663535,"ok"],
["Kossuth Lajos utca 187/a.",46.360222,17.658936,"ok","OSM-ben 187 (a „/a” nélkül)"],
["Kossuth Lajos utca 228.",46.359997,17.659415,"ok"],
["Kultúrház",46.360514,17.662031,"ok"],
["Központ",null,null,"none"],
["Dózsa György utca 4.",46.359827,17.662578,"street"],
["Dózsa György utca 14.",46.359827,17.662578,"street"],
["Dózsa György utca 42.",46.359827,17.662578,"street"],
["Zrínyi utca 13.",46.362935,17.658636,"street","OSM: Zrínyi Miklós utca"],
["Zrínyi utca 20.",46.362935,17.658636,"street","OSM: Zrínyi Miklós utca"],
["Zrínyi utca 42.",46.362935,17.658636,"street","OSM: Zrínyi Miklós utca"],
["Csokonai játszótér",null,null,"none"],
["Csokonai utca 23.",46.361600,17.656563,"street"],
["Búzavirág utca 19.",46.358455,17.667134,"street"],
["Búzavirág utca 22.",46.358455,17.667134,"street"]
];

// ---- belépés
$('b-login').onclick=function(){
  $('err').textContent='';
  sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}})
    .then(function(r){if(r.error)$('err').textContent='Belépési hiba: '+r.error.message;});
};
$('b-out').onclick=function(){sb.auth.signOut().then(function(){location.reload()});};

var user=null,started=false;
sb.auth.onAuthStateChange(function(ev,session){
  if(session&&!started){started=true;user=session.user;route();}
  else if(!session){started=false;show('s-login');}
});

function route(){
  sb.from('profiles').select('kids').eq('user_id',user.id).maybeSingle().then(function(r){
    if(r.data&&r.data.kids&&r.data.kids.length)startMap(r.data.kids);else show('s-count');
  });
}

// ---- 1. lépés: hány gyerek
var sel=$('sel-count');
for(var k=1;k<=8;k++){var o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o);}
sel.onchange=function(){$('b-count').disabled=!sel.value;};
$('b-count').onclick=function(){
  var n=+sel.value,box=$('names-fields');
  $('names-title').textContent=n===1?'Add meg a gyerek nevét:':'Add meg a gyerekek neveit:';
  box.innerHTML='';
  for(var i=0;i<n;i++){var inp=document.createElement('input');inp.type='text';inp.maxLength=40;inp.placeholder=n>1?(i+1)+'. gyerek neve':'Név';inp.oninput=checkNames;box.appendChild(inp);}
  checkNames();show('s-names');
};
function checkNames(){
  var ins=$('names-fields').querySelectorAll('input');
  $('b-names').disabled=![].every.call(ins,function(i){return i.value.trim()});
}
// ---- 2. lépés: nevek mentése
$('b-names').onclick=function(){
  var kids=[].map.call($('names-fields').querySelectorAll('input'),function(i){return i.value.trim()});
  $('b-names').disabled=true;
  sb.from('profiles').upsert({user_id:user.id,kids:kids}).then(function(r){
    if(r.error){alert('Mentési hiba: '+r.error.message);checkNames();return;}
    startMap(kids);
  });
};

// ---- térkép
var map,gpsOn=false,watchId=null,meMarker=null,accCircle=null;
function icon(n){return L.divIcon({className:'pk',iconSize:[40,40],iconAnchor:[20,36],html:
'<svg width="40" height="40" viewBox="0 0 38 38"><path d="M19 8c0-3 1-5 4-6" stroke="#2b1b3d" stroke-width="4" fill="none"/><path d="M19 8c0-3 1-5 4-6" stroke="#3aa51e" stroke-width="2" fill="none"/>'+
'<g stroke="#2b1b3d" stroke-width="2"><ellipse cx="11" cy="22" rx="9" ry="12" fill="#e07800"/><ellipse cx="27" cy="22" rx="9" ry="12" fill="#e07800"/><ellipse cx="19" cy="22" rx="9" ry="13" fill="#ff8a00"/></g>'+
'<text x="19" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#2b1b3d" font-family="Fredoka,system-ui">'+n+'</text></svg>'});}

function startMap(kids){
  show('app');
  $('hdr').textContent='🎃 Búú! – '+kids.join(', ');
  sb.from('visits').select('place_idx,visited,lat,lon').eq('user_id',user.id).then(function(r){
    var st={};(r.data||[]).forEach(function(v){st[v.place_idx]=v;});
    buildMap(st);
  });
}

function buildMap(st){
  if(map){map.remove();}
  $('list').innerHTML='';
  map=L.map('map').setView(CENTER,16);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  var list=$('list'),ms=[];
  function save(i,fields){
    var row=Object.assign({user_id:user.id,place_idx:i},fields);
    sb.from('visits').upsert(row,{onConflict:'user_id,place_idx'}).then(function(r){if(r.error)alert('Mentési hiba: '+r.error.message);});
  }
  P.forEach(function(p,i){
    var n=i+1,s=st[i]||{},drag=p[3]!=="ok";
    var ll=s.lat!=null?[s.lat,s.lon]:(p[1]==null?CENTER:[p[1],p[2]]);
    var m=L.marker(ll,{icon:icon(n),draggable:drag,title:p[0]});
    var li=document.createElement('li');if(drag)li.className='warn';
    var note=s.lat!=null?'kézzel igazítva':p[3]==="ok"?(p[4]||"pontos találat"):p[3]==="street"?"csak utca-szintű – húzd a házra! "+(p[4]||""):"nincs találat – húzd a helyére!";
    li.innerHTML='<div class="n"></div><div class="t"><b></b><span></span></div><input type="checkbox" class="ck" title="Jártunk itt">';
    li.querySelector('.n').textContent=n;li.querySelector('b').textContent=p[0];
    var info=li.querySelector('span');info.textContent=note;
    m.bindPopup('<b>'+n+'. '+p[0]+'</b>');
    m.on('dragend',function(){var c=m.getLatLng();info.textContent='kézzel igazítva';save(i,{lat:c.lat,lon:c.lng});});
    var ck=li.querySelector('.ck');
    function setDone(d){li.classList.toggle('done',d);ck.checked=d;if(d)map.removeLayer(m);else m.addTo(map);}
    ck.onclick=function(e){e.stopPropagation();setDone(ck.checked);save(i,{visited:ck.checked});};
    setDone(!!s.visited);
    li.onclick=function(){if(!map.hasLayer(m))return;[].forEach.call(list.children,function(x){x.classList.remove('on')});li.classList.add('on');map.flyTo(m.getLatLng(),18);m.openPopup();};
    m.on('click',function(){li.scrollIntoView({block:'nearest'});});
    list.appendChild(li);ms.push(m);
  });
  map.fitBounds(L.featureGroup(ms).getBounds().pad(.15));
  setTimeout(function(){map.invalidateSize()},100);
}

// ---- GPS: 📍 gomb be/ki
$('gps').onclick=function(){
  if(gpsOn){navigator.geolocation.clearWatch(watchId);gpsOn=false;$('gps').classList.remove('on');
    if(meMarker){map.removeLayer(meMarker);map.removeLayer(accCircle);meMarker=accCircle=null;}return;}
  if(!navigator.geolocation){alert('Ez az eszköz nem támogatja a helymeghatározást.');return;}
  var first=true;
  gpsOn=true;$('gps').classList.add('on');
  watchId=navigator.geolocation.watchPosition(function(pos){
    var ll=[pos.coords.latitude,pos.coords.longitude];
    if(!meMarker){
      meMarker=L.marker(ll,{icon:L.divIcon({className:'pk',iconSize:[18,18],html:'<div class="me"></div>'}),interactive:false,zIndexOffset:1000}).addTo(map);
      accCircle=L.circle(ll,{radius:pos.coords.accuracy,color:'#1e88ff',weight:2,fillOpacity:.1}).addTo(map);
    }else{meMarker.setLatLng(ll);accCircle.setLatLng(ll).setRadius(pos.coords.accuracy);}
    if(first){first=false;map.flyTo(ll,Math.max(map.getZoom(),17));}
  },function(e){
    gpsOn=false;$('gps').classList.remove('on');
    alert(e.code===1?'A helymeghatározás le van tiltva. Engedélyezd a böngésző beállításaiban.':'Nem sikerült meghatározni a helyzetet.');
  },{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
};
</script>
</body>
</html>
