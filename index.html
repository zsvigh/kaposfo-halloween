<style>
:root{--or:#ff8a00;--bg:#0d0b12;--card:#1a1522;--tx:#f4e9d8;--mut:#9a8fa8}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{padding:10px 16px;text-align:center;border-bottom:2px solid var(--or)}
header h1{margin:0;font-size:2rem;color:var(--or);text-shadow:0 0 12px #ff8a0088;letter-spacing:2px}
header small{color:var(--mut)}
#map{flex:1 1 55%;min-height:260px}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.75) contrast(.9) saturate(.5)}
#list{flex:1 1 45%;overflow:auto;margin:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));list-style:none;background:var(--bg)}
#list li{display:flex;gap:12px;align-items:center;padding:12px;margin-bottom:8px;background:var(--card);border:1px solid #2c2338;border-radius:12px;cursor:pointer;min-height:56px}
#list li:active,#list li.on{border-color:var(--or);box-shadow:0 0 10px #ff8a0066}
.n{flex:none;width:34px;height:34px;border-radius:50% 50% 45% 45%;background:var(--or);color:#1a0f00;font-weight:800;display:grid;place-items:center}
.t{flex:1}.t b{display:block}.t span{font-size:.78rem;color:var(--mut)}
.warn .t span{color:#ffb347}
#list li.done{opacity:.5}#list li.done .t b{text-decoration:line-through}
.ck{flex:none;width:28px;height:28px;accent-color:var(--or);cursor:pointer}
.pk{background:none;border:0}
.pk svg{filter:drop-shadow(0 0 5px #ff8a00aa)}
@media(min-width:800px){body{flex-direction:row;flex-wrap:wrap}header{width:100%}#map{flex:1 1 65%}#list{flex:0 0 35%}}
</style>
</head>
<body>
<header><h1>🎃 Búú!</h1><small>Kaposfő – Halloween útvonal · koppints a listára</small></header>
<div id="map"></div>
<ul id="list"></ul>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// Nominatim-ból előre lekérve. st: ok = házszám-pontos / street = csak utca-szintű találat / none = nincs találat
// ponytail: street/none tételek húzhatók, de a húzott hely nem mentődik (másold le a koordinátát a listából).
var CENTER=[46.3610,17.6620];
var P=[
["Kossuth Lajos utca 133.",46.361867,17.666548,"ok"],
["Kossuth Lajos utca 155.",46.361210,17.663535,"ok"],
["Kossuth Lajos utca 187/a.",46.360222,17.658936,"ok","OSM-ben 187 (a „/a” nélkül)"],
["Kossuth Lajos utca 228.",46.359997,17.659415,"ok"],
["Kultúrház",46.360514,17.662031,"ok"],
["Központ",null,null,"none"],
["Dózsa György utca 4.",46.359827,17.662578,"street"],
["Dózsa György utca 14.",46.359827,17.662578,"street"],
["Dózsa György utca 42.",46.359827,17.662578,"street"],
["Zrínyi utca 13.",46.362935,17.658636,"street","OSM: Zrínyi Miklós utca"],
["Zrínyi utca 20.",46.362935,17.658636,"street","OSM: Zrínyi Miklós utca"],
["Zrínyi utca 42.",46.362935,17.658636,"street","OSM: Zrínyi Miklós utca"],
["Csokonai játszótér",null,null,"none"],
["Csokonai utca 23.",46.361600,17.656563,"street"],
["Búzavirág utca 19.",46.358455,17.667134,"street"],
["Búzavirág utca 22.",46.358455,17.667134,"street"]
];
var map=L.map('map').setView(CENTER,16);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
function icon(n){return L.divIcon({className:'pk',iconSize:[38,38],iconAnchor:[19,34],html:
'<svg width="38" height="38" viewBox="0 0 38 38"><path d="M19 8c0-3 1-5 4-6" stroke="#3a7d1e" stroke-width="3" fill="none"/><ellipse cx="11" cy="22" rx="9" ry="12" fill="#e07800"/><ellipse cx="27" cy="22" rx="9" ry="12" fill="#e07800"/><ellipse cx="19" cy="22" rx="9" ry="13" fill="#ff8a00"/>'+
'<text x="19" y="28" text-anchor="middle" font-size="15" font-weight="800" fill="#1a0f00" font-family="system-ui">'+n+'</text></svg>'});}
var list=document.getElementById('list'),ms=[];
P.forEach(function(p,i){
  var n=i+1,ll=p[1]==null?CENTER:[p[1],p[2]],drag=p[3]!=="ok";
  var m=L.marker(ll,{icon:icon(n),draggable:drag,title:p[0]}).addTo(map);
  var note=p[3]==="ok"?(p[4]||"pontos találat"):p[3]==="street"?"csak utca-szintű – húzd a házra! "+(p[4]||""):"nincs találat – húzd a helyére!";
  var li=document.createElement('li');if(drag)li.className='warn';
  li.innerHTML='<div class="n">'+n+'</div><div class="t"><b>'+p[0]+'</b><span>'+note+'</span></div><input type="checkbox" class="ck" title="Jártunk itt">';
  var info=li.querySelector('span');
  m.bindPopup('<b>'+n+'. '+p[0]+'</b>');
  m.on('dragend',function(){var c=m.getLatLng();info.textContent='kézzel igazítva: '+c.lat.toFixed(6)+', '+c.lng.toFixed(6);});
  var ck=li.querySelector('.ck'),key='kaposfo-done-'+i;
  function setDone(d){li.classList.toggle('done',d);ck.checked=d;if(d)map.removeLayer(m);else m.addTo(map);}
  ck.onclick=function(e){e.stopPropagation();setDone(ck.checked);try{localStorage.setItem(key,ck.checked?'1':'')}catch(x){}};
  try{if(localStorage.getItem(key))setDone(true)}catch(x){}
  li.onclick=function(){if(!map.hasLayer(m))return;[].forEach.call(list.children,function(x){x.classList.remove('on')});li.classList.add('on');map.flyTo(m.getLatLng(),18);m.openPopup();};
  m.on('click',function(){li.scrollIntoView({block:'nearest'});});
  list.appendChild(li);ms.push(m);
});
map.fitBounds(L.featureGroup(ms).getBounds().pad(.15));
</script>
</body>
</html>
